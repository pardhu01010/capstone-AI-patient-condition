version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: patient-condition-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend:/app/backend
    depends_on:
      - qdrant

  ambulance-ui:
    image: node:20-alpine
    container_name: ambulance-ui
    working_dir: /app
    volumes:
      - ./apps/ambulance_ui:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_URL=http://localhost:8000

  hospital-ui:
    image: node:20-alpine
    container_name: hospital-ui
    working_dir: /app
    volumes:
      - ./apps/hospital_ui:/app
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      - VITE_API_URL=http://localhost:8000

  qdrant:
    image: qdrant/qdrant:latest
    container_name: patient-condition-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
